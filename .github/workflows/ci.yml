name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 项目只在 Windows 上运行（NTFS/回收站/注册表），CI 用真实目标平台
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # rpc.test.ts 的静态资源/SPA 回退用例需要 packages/ui/dist；先构建再收集/跑测试
      - name: Build UI
        run: pnpm build:ui
      - name: Project facts
        run: pnpm facts
      - name: Docs consistency
        run: pnpm docs:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck UI (vue-tsc)
        run: pnpm typecheck:ui
      - name: Unit / integration tests
        run: |
          pnpm vitest run 2>&1 | Tee-Object -FilePath .test-output.log
          exit $LASTEXITCODE
      # 失败时把具体失败用例打成 annotation，便于不用登录下载日志也能定位 CI 红点
      - name: Summarize failed tests
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path .test-output.log)) { exit 0 }
          $lines = Get-Content .test-output.log
          $failed = $lines | Select-String -Pattern '^ FAIL |^\s+FAIL ' | Select-Object -First 12
          foreach ($f in $failed) { Write-Host ("::error::" + $f.Line.Trim()) }
          $errors = $lines | Select-String -Pattern 'AssertionError|Error: Test timed out|Unhandled Errors' | Select-Object -First 12
          foreach ($e in $errors) { Write-Host ("::error::" + $e.Line.Trim()) }
