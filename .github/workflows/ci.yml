name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 项目只在 Windows 上运行（NTFS/回收站/注册表），CI 用真实目标平台
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck UI (vue-tsc)
        run: pnpm typecheck:ui
      # rpc.test.ts 的静态资源/SPA 回退用例需要 packages/ui/dist；先构建再跑测试
      - name: Build UI
        run: pnpm build:ui
      - name: Unit / integration tests
        run: pnpm vitest run
